---
- name: Garantir grupo geral
  ansible.builtin.group:
    name: geral
    state: present

- name: Garantir grupo midia
  ansible.builtin.group:
    name: midia
    state: present

- name: Garantir grupo canal
  ansible.builtin.group:
    name: canal
    state: present

- name: Garantir usuário obertobr
  ansible.builtin.user:
    name: obertobr
    groups:
      - sudo
      - geral
      - canal
    append: true
    shell: /bin/bash

- name: Garantir usuário pai
  ansible.builtin.user:
    name: pai
    groups:
      - geral
    append: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Garantir usuário amigos
  ansible.builtin.user:
    name: amigos
    groups:
      - geral
      - canal
    append: true
    shell: /usr/sbin/nologin
    create_home: false