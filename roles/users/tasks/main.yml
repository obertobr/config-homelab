---
- name: Garantir grupos do homelab
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ homelab_groups }}"

- name: Garantir usuários do homelab
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ '/bin/bash' if item.admin else '/usr/sbin/nologin' }}"
    create_home: "{{ item.admin }}"
    state: present
  loop: "{{ homelab_users }}"

- name: Adicionar usuários aos grupos desejados
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups + (['sudo'] if item.admin else []) }}"
    append: true
  loop: "{{ homelab_users }}"

- name: Obter grupos atuais dos usuários
  ansible.builtin.command:
    cmd: "id -nG {{ item.name }}"
  loop: "{{ homelab_users }}"
  register: homelab_user_groups
  changed_when: false

- name: Remover usuários dos grupos do homelab que não estão mais declarados
  ansible.builtin.command:
    cmd: "gpasswd -d {{ item.0.item.name }} {{ item.1 }}"
  loop: >-
    {{
      homelab_user_groups.results
      | subelements('stdout_lines')
    }}
  when:
    - item.1 in homelab_groups
    - item.1 not in item.0.item.groups
  register: homelab_group_removals
  changed_when: true