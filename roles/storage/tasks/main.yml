---
- name: Garantir suporte a ACL
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true

- name: Garantir diretório principal do armazenamento
  ansible.builtin.file:
    path: /mnt/disk
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Garantir diretórios do armazenamento
  ansible.builtin.file:
    path: "/mnt/disk/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - name: canal
      owner: root
      group: canal
      mode: "2770"

    - name: geral
      owner: root
      group: geral
      mode: "2770"

    - name: midia
      owner: root
      group: geral
      mode: "2770"

    - name: obertobr
      owner: obertobr
      group: obertobr
      mode: "0700"

    - name: pai
      owner: pai
      group: pai
      mode: "0700"

    - name: amigos
      owner: amigos
      group: amigos
      mode: "0700"

- name: Garantir acesso de leitura do grupo midia na pasta
  ansible.posix.acl:
    path: /mnt/disk/midia
    entity: midia
    etype: group
    permissions: r-x
    state: present

- name: Garantir ACL padrão de leitura para o grupo midia
  ansible.posix.acl:
    path: /mnt/disk/midia
    entity: midia
    etype: group
    permissions: r-x
    default: true
    state: present

- name: Garantir ACL padrão de leitura e escrita para o grupo geral
  ansible.posix.acl:
    path: /mnt/disk/midia
    entity: geral
    etype: group
    permissions: rwx
    default: true
    state: present