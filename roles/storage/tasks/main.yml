---
- name: Garantir suporte a ACL
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true

- name: Garantir diretório principal do armazenamento
  ansible.builtin.file:
    path: /mnt/disk
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Garantir diretórios compartilhados
  ansible.builtin.file:
    path: "/mnt/disk/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - name: canal
      owner: root
      group: canal
      mode: "2770"

    - name: geral
      owner: root
      group: geral
      mode: "2770"

    - name: midia
      owner: root
      group: geral
      mode: "2770"

- name: Garantir diretórios pessoais dos usuários
  ansible.builtin.file:
    path: "/mnt/disk/{{ item.name }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ homelab_users }}"

- name: Garantir acesso de leitura do grupo midia na pasta
  ansible.posix.acl:
    path: /mnt/disk/midia
    entity: midia
    etype: group
    permissions: r-x
    state: present

- name: Garantir ACL padrão de leitura para o grupo midia
  ansible.posix.acl:
    path: /mnt/disk/midia
    entity: midia
    etype: group
    permissions: r-x
    default: true
    state: present

- name: Garantir ACL padrão de leitura e escrita para o grupo geral
  ansible.posix.acl:
    path: /mnt/disk/midia
    entity: geral
    etype: group
    permissions: rwx
    default: true
    state: present